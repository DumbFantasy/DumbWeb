<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUE TANTO LE SABES AL ESPIKOS?</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #22c55e;
            --incorrect: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .quiz-body {
            padding: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-number {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .multi-hint {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 15px;
            font-style: italic;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #334155;
            color: var(--text-main);
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: var(--accent);
            background-color: #475569;
        }

        .option-btn.correct {
            background-color: rgba(34, 197, 94, 0.2);
            border-color: var(--correct);
            color: #86efac;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--incorrect);
            color: #fca5a5;
        }

        .btn-next, .btn-submit-multi {
            margin-top: 25px;
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-next:hover, .btn-submit-multi:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }

        .results-container {
            text-align: center;
            padding: 40px 20px;
        }

        .results-container h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .results-container p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .score-badge {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Que tanto le sabes al Espikos?</h1>
        </div>
        <div class="quiz-body" id="quiz-body">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="question-number" id="question-number">Pregunta 1 de 20</div>
            <div class="question-text" id="question-text">Cargando pregunta...</div>
            <div class="multi-hint" id="multi-hint" style="display: none;">💡 Selecciona todas las respuestas correctas y presiona comprobar.</div>
            <div class="options-list" id="options-list"></div>
            <button id="action-btn" class="hidden" onclick="handleActionBtn()">Comprobar respuesta</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Como se llama la piedra que le da poder y nacimiento al espikos siendo la cosa más poderosa de su universo?",
                options: ["Piedra Filosofal", "CRACK", "Andromedita", "Piedra Espiko"],
                correct: 2 // Andromedita
            },
            {
                question: "Cierto o Falso: Es verdad que Elías Varnet en su lapso de años con la investigación de la piedra pudo obtener temporalmente una especie de inmortalidad?",
                options: ["Cierto", "Falso"],
                correct: 0 // Cierto
            },
            {
                question: "Que le cayó a Varnet durante su investigación para alcanzar el poder absoluto?",
                options: ["Una manzana", "Un fragmento de poder celestial", "Un antiguo grimorio que corrompió su mente", "Popo de pajaro", "El 20"],
                correct: 4 // El 20
            },
            {
                question: "¿En donde sale \"El hijo de Hernández\" de Cuarteto de nos?",
                options: ["En la de Skriker", "Espikos", "YO NO SOY EL ENGENDRO DE VERNET (esta es la correcta xdxd)", "Spike", "Luminiscente", "Cuando aparece el abuelo del eskrikoso", "Spike 3", "En la batalla final de la saga", "Spike 2: Umbranova", "del KILLSANS xdxdxd", "Pues cuando sale Varnet no?"],
                correct: [2, 8], // Tanto la respuesta 3 (índice 2) como la 9 (índice 8) son correctas
                multiple: true
            },
            {
                question: "Cuáles son los papás de Spike?",
                options: ["Elias Varnet", "Richar y Mary Parker", "María Antonieta y su hermanita", "¿¡SPIKE TIENE PAPÁS?!", "Una piedrita mágica como no", "Sonic y Shadow"],
                correct: [3, 4], // Tanto la 4 (índice 3) como la 5 (índice 4) son correctas
                multiple: true
            },
            {
                question: "¿Que significa este logo?",
                options: ["Aaah simón es el Distrito Federal", "Defecando Focas", "Dedos en el Fundillo xdxdxd", "Diablos Fuertotes", "Dumb Fantasy", "Amazing Fantasy", "pus es nomas una D y una F que quiere?"],
                correct: 4 // Dumb Fantasy
            },
            {
                question: "Es cierto que Spike tiene miedo a ser rechazado, aunque sea un ser poderoso?",
                options: ["Si", "Nah que, ES EL ESPIKOS"],
                correct: 0 // Si
            },
            {
                question: "Ya te leíste Luminiscente? (Donde sale el Skriker pues ah por cierto estas dos son buenas)",
                options: ["¡SI!", "No...."],
                correct: [0, 1], // Las dos son buenas/correctas
                multiple: true
            },
            {
                question: "SOY EL VERNTET...",
                options: ["TENGO QUE ATRAPARLOS", "NAIN NAIN NAIN NAIN NAIN NAIN", "OYE MI VOZ", "Y ESTAS SON MIS ISLAS"],
                correct: 3 // Y ESTAS SON MIS ISLAS
            },
            {
                question: "Selecciona las canciones mas perronas de la playlist del espikos (puedes checarlas y escucharlas si eso ayuda)",
                options: [
                    "GOSSIP, My Way Of Life, Bad y Creep",
                    "Dont Stop Me Now, Time to Pretend, Cambiante y I Hear a Simphony",
                    "Holiday, Mr Blue Sky y Im Still Standing",
                    "Intruso, Ride the Lignthing y Lo malo de ser Bueno",
                    "TODAS ALV APARTE DE SER MUCHAS MEJOR PQ ESTAN BIEN PERRONAS"
                ],
                correct: 4 // TODAS ALV...
            },
            {
                question: "Que significan las siglas S.P.K?",
                options: ["Señal de Paso Kilometrico", "Sentido de Partido Kiwi", "Servicio de Prevencion de Kaos", "Sujeto de Potencial Kinésico"],
                correct: 3 // Sujeto de Potencial Kinésico
            },
            {
                question: "Es cierto que quieres ver mas del Universo del espikos",
                options: ["Si", "No"],
                correct: 0 // Si
            },
            {
                question: "Cuando es el cumpleaños del Espikos?",
                options: ["30 de febrero", "27 de enero", "26 de mayo", "21 de junio"],
                correct: 3 // 21 de junio
            },
            {
                question: "Que sigue después de la frase \"Alibaba ahí está el fenómeno...\"",
                options: ["Conlleva una gran responsabilidad", "Yo soy inevitable", "Skibidi dop dop dop yes yes skibidi skibidi diip diiip", "Aquel creado de la naturaleza"],
                correct: 3 // Aquel creado de la naturaleza
            },
            {
                question: "Cuál es el nuevo personaje que se presentó en Spike 2 pero existe antes de que se descubriera a Spike?",
                options: ["Elias Varnet", "El contador", "Lucifer (no el de hazbin si no el de este universo aah ya te espoilie AAAAAH xdxd)", "Skriker"],
                correct: 3 // Skriker
            },
            {
                question: "Que le pasara a Varnet en Spike 3? (Spoiler)",
                options: ["Se volverá amigo del espikos", "Hara la de \"mentira soy bueno\" y sera un pibe normal", "Sera un pejelagarto", "Morirá debido a su sentencia a muerte por todos sus actos ¿Como morirá? eh pues en una silla eléctrica pero no muere... del todo"],
                correct: 3 // Morirá debido a su sentencia...
            },
            {
                question: "Spike regresara para Avengers Doomsday?",
                options: ["Si", "No"],
                correct: 0 // Si
            },
            {
                question: "A quien hace referencia el espikos cuando die \"VENGO DE BARRIO PU-&quot;...?",
                options: ["Glicht", "A un amigo suyo (no tiene JAJS, bueno a lo mejor y Skriker)", "Ps al hazbin"],
                correct: 2 // Ps al hazbin (tercera opción)
            },
            {
                question: "Como se llama la ciudad donde se encuentra el espikos?",
                options: ["Ciudad Gotica", "Nueva York", "Ciudad Seltsamer", "Metropolis"],
                correct: 2 // Ciudad Seltsamer
            },
            {
                question: "Debería agregar a Ado a la playlist y al universo del espikos?",
                options: ["Si", "No"],
                correct: 0 // Si
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswers = [];
        let answered = false;

        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsListEl = document.getElementById('options-list');
        const progressEl = document.getElementById('progress');
        const actionBtn = document.getElementById('action-btn');
        const multiHintEl = document.getElementById('multi-hint');
        const quizBodyEl = document.getElementById('quiz-body');

        function loadQuestion() {
            answered = false;
            selectedAnswers = [];
            actionBtn.classList.add('hidden');
            
            const q = questions[currentQuestion];
            questionNumberEl.innerText = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
            questionTextEl.innerText = q.question;
            
            progressEl.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            if (q.multiple) {
                multiHintEl.style.display = 'block';
                actionBtn.innerText = 'Comprobar respuesta';
                actionBtn.classList.remove('hidden');
            } else {
                multiHintEl.style.display = 'none';
            }

            optionsListEl.innerHTML = '';
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn, q.multiple);
                optionsListEl.appendChild(btn);
            });
        }

        function selectOption(index, btn, isMultiple) {
            if (answered) return;

            if (isMultiple) {
                const pos = selectedAnswers.indexOf(index);
                if (pos > -1) {
                    selectedAnswers.splice(pos, 1);
                    btn.classList.remove('selected');
                } else {
                    selectedAnswers.push(index);
                    btn.classList.add('selected');
                }
            } else {
                // Selección única: responder de inmediato
                answered = true;
                const q = questions[currentQuestion];
                const buttons = optionsListEl.children;

                if (index === q.correct) {
                    btn.classList.add('correct');
                    score++;
                } else {
                    btn.classList.add('incorrect');
                    buttons[q.correct].classList.add('correct');
                }

                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion < questions.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }, 1400);
            }
        }

        function handleActionBtn() {
            if (answered) return;
            const q = questions[currentQuestion];
            if (selectedAnswers.length === 0) {
                alert('Por favor selecciona al menos una opción.');
                return;
            }

            answered = true;
            const buttons = optionsListEl.children;
            const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];

            // Comprobar si seleccionó exactamente las correctas
            const isCorrect = selectedAnswers.length === correctArr.length && 
                              selectedAnswers.every(val => correctArr.includes(val));

            if (isCorrect) {
                score++;
                selectedAnswers.forEach(idx => buttons[idx].classList.add('correct'));
            } else {
                selectedAnswers.forEach(idx => {
                    if (correctArr.includes(idx)) {
                        buttons[idx].classList.add('correct');
                    } else {
                        buttons[idx].classList.add('incorrect');
                    }
                });
                correctArr.forEach(idx => {
                    buttons[idx].classList.add('correct');
                });
            }

            actionBtn.innerText = 'Siguiente pregunta';
            actionBtn.onclick = nextQuestion;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                actionBtn.onclick = handleActionBtn;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            progressEl.style.width = '100%';
            let feedback = "";
            if (score === questions.length) {
                feedback = "¡Impresionante! ¡Eres todo un experto en el universo del Espikos! 🔥";
            } else if (score >= questions.length / 2) {
                feedback = "¡Muy bien! Conoces bastante bien al Espikos, aunque te faltaron algunos detallitos. 😎";
            } else {
                feedback = "¡Te falta leer más sobre el Espikos y sus aventuras! Échale un ojo al Lore. 📚";
            }

            quizBodyEl.innerHTML = `
                <div class="results-container">
                    <h2>¡Quiz Completado!</h2>
                    <div class="score-badge">${score} / ${questions.length}</div>
                    <p>${feedback}</p>
                    <button class="btn-next" onclick="location.reload()">Volver a jugar</button>
                </div>
            `;
        }

        loadQuestion();
    </script>
</body>
</html>
